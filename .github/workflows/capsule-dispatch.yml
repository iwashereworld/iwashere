name: Capsule Dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Skip until delivery infrastructure is ready
        env:
          ENABLE_CAPSULE_DISPATCH: ${{ secrets.ENABLE_CAPSULE_DISPATCH }}
        run: |
          if [ "$ENABLE_CAPSULE_DISPATCH" != "true" ]; then
            echo "Capsule dispatch is disabled until production delivery secrets are ready."
            exit 0
          fi

      - name: Validate required secrets
        env:
          ENABLE_CAPSULE_DISPATCH: ${{ secrets.ENABLE_CAPSULE_DISPATCH }}
          CAPSULE_DISPATCH_URL: ${{ secrets.CAPSULE_DISPATCH_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        if: ${{ secrets.ENABLE_CAPSULE_DISPATCH == 'true' }}
        run: |
          test -n "$CAPSULE_DISPATCH_URL"
          test -n "$SUPABASE_ANON_KEY"

      - name: Invoke capsule dispatch
        env:
          ENABLE_CAPSULE_DISPATCH: ${{ secrets.ENABLE_CAPSULE_DISPATCH }}
          CAPSULE_DISPATCH_URL: ${{ secrets.CAPSULE_DISPATCH_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        if: ${{ secrets.ENABLE_CAPSULE_DISPATCH == 'true' }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$CAPSULE_DISPATCH_URL" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
